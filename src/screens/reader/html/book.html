<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        padding: 20px;
        font-family: -apple-system, Roboto, sans-serif;
        font-size: 18px;
        line-height: 1.6;
        background: #fff;
        overflow: hidden; /* prevent normal scroll */
      }
      #content {
        height: 100vh;
        column-width: 100vw;   /* one page = screen width */
        column-gap: 40px;      /* gap between pages */
        overflow: hidden;
      }
      .page-break {
        break-after: column;
      }
      img {
        max-width: 90%;
        border-radius: 10px;
        margin: 20px 0;
      }
    </style>
  </head>
  <body>
    <div id="content">
      <h1>📖 My Book Title</h1>
      <p>This is page one. Paragraphs flow into columns automatically.</p>
      <img src="https://placekitten.com/400/250" alt="kitten" />
      <p class="page-break">This forces next content to a new page.</p>
      <p>This is the next page, with more text and images.</p>
      <p>Keep writing your book here...</p>
    </div>
    <script>
      let currentPage = 0;

      function getTotalPages() {
        const totalWidth = document.getElementById("content").scrollWidth;
        return Math.ceil(totalWidth / window.innerWidth);
      }

      function goToPage(page) {
        currentPage = Math.max(0, Math.min(page, getTotalPages() - 1));
        window.scrollTo({
          left: currentPage * window.innerWidth,
          behavior: "smooth",
        });
        window.ReactNativeWebView.postMessage(
          JSON.stringify({ page: currentPage + 1, total: getTotalPages() })
        );
      }

      // Expose to RN
      window.nextPage = () => goToPage(currentPage + 1);
      window.prevPage = () => goToPage(currentPage - 1);

      // Send initial page info
      window.onload = () => {
        window.ReactNativeWebView.postMessage(
          JSON.stringify({ page: 1, total: getTotalPages() })
        );
      };
    </script>
  </body>
</html>
